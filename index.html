<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Information Portal</h1>
        
        <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label for="regNo">Register Number:</label>
            <input type="text" id="regNo" placeholder="Enter register number">
        </div>
        
        <div class="form-group">
            <label for="programme">Programme:</label>
            <input type="text" id="programme" placeholder="Enter programme">
        </div>
        
        <button id="showBtn">Show Details</button>
    </div>
    
    <div id="output" class="output" style="width: 100%; max-width: 400px;"></div>
    
    <script src="script.js"></script>
</body>
</html>
